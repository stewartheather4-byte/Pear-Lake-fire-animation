name: Pear Lake Wildfire Animation

on:
  schedule:
    - cron: '0 23 * * *'
      timezone: "America/Vancouver"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pear-lake-wildfire-daily
  cancel-in-progress: false

jobs:
  update-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

   

      - name: Run Pear Lake wildfire animation
        run: |
          echo "Files GitHub can see:"
          find . -maxdepth 3 -type f -print
          SCRIPT=$(find . -maxdepth 3 -type f -name "pear_lake_fire_animation.py" | head -n 1)
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: pear_lake__animation.py was not found."
            exit 1
          fi

          echo "Running: $SCRIPT"
          python "$SCRIPT"
          
          

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pear Lake animation website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish latest animation files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest-animation >/dev/null 2>&1; then
            gh release create latest-animation \
              --title "Latest Pear Lake Wildfire Animation" \
              --notes "Automatically updated Pear Lake C40983 NASA FIRMS animation."
          fi

          gh release upload latest-animation \
            pear_lake_fire_animation.mp4 \
            pear_lake_fire_animation.gif \
            latest.png \
            --clobber

      - name: Stop daily updates when fire stops expanding
        if: ${{ hashFiles('stop_updates.flag') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Five completed no-expansion days reached."
          echo "Disabling the Pear Lake daily workflow."

          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/pear-lake-fire.yml/disable"
