name: BC Fire History 2017-2026

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bc-fire-history:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy matplotlib contextily shapely pyproj

      - name: Run BC fire history script
        run: |
          if [ -f "bc_fire_history_2017_2026(1).py" ]; then
            python "bc_fire_history_2017_2026(1).py"
          elif [ -f "bc_fire_history_2017_2026.py" ]; then
            python "bc_fire_history_2017_2026.py"
          else
            echo "BC fire history Python file was not found."
            exit 1
          fi

      - name: Upload the 20 BC fire images
        uses: actions/upload-artifact@v4
        with:
          name: BC-Fire-History-2017-2026
          path: bc_fire_images_2017_2026/
